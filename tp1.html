<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Go Cooldown Timer</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div class="controls">
        <div class="info-panel">
            <h1>冷卻計時器</h1>
            <div id="status">這是您的目前位置嗎？</div>
            <div id="timer">00:00:00</div>
            <div id="radius-info">半徑: 0 公里</div>
        </div>
        <div class="button-group">
            <button id="locate-btn" class="btn secondary">📍 定位我的位置</button>
            <button id="start-btn" class="btn primary" disabled>▶ 開始計時</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
